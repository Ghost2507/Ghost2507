<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Allocation Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Memory Allocation Visualizer</h1>
      <p>Simulate Best Fit, Worst Fit, Next Fit, and Hybrid Allocation Algorithms</p>
      <button id="themeToggle">Switch to Light Mode</button>
    </header>

    <section class="input-area">
      <div class="input-group">
        <label>Number of Processes:</label>
        <input type="number" id="numProcesses" min="1" value="3" />
        <button id="generateBtn">Generate Fields</button>
      </div>

      <div class="input-group">
        <label>Memory Limit (KB):</label>
        <input type="number" id="memoryLimit" min="1" value="100" />
      </div>

      <div class="input-group">
        <label for="algorithmSelect">Select Algorithm:</label>
        <select id="algorithmSelect">
          <option value="bestFit">Best Fit</option>
          <option value="worstFit">Worst Fit</option>
          <option value="nextFit">Next Fit</option>
          <option value="hybrid">Hybrid</option>
        </select>
      </div>

      <form id="processForm" class="hidden">
        <div id="processInputs"></div>
        <button type="submit" id="runBtn">Run Selected Algorithm</button>
      </form>
    </section>

    <section id="algorithmResults" class="hidden">
      <div class="algo-card" id="bestFit">
        <h2>Best Fit</h2>
        <div class="taskContainer"></div>
        <div class="stats"></div>
        <div class="viz"></div>
      </div>

      <div class="algo-card" id="worstFit">
        <h2>Worst Fit</h2>
        <div class="taskContainer"></div>
        <div class="stats"></div>
        <div class="viz"></div>
      </div>

      <div class="algo-card" id="nextFit">
        <h2>Next Fit</h2>
        <div class="taskContainer"></div>
        <div class="stats"></div>
        <div class="viz"></div>
      </div>

      <div class="algo-card" id="hybrid">
        <h2>Hybrid Algorithm</h2>
        <div class="taskContainer"></div>
        <div class="stats"></div>
        <div class="viz"></div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
